# ============================================================
# application-test.properties : Profil tests automatisés
# Utilisé par JUnit / Spring Boot Test (@SpringBootTest)
# ============================================================

# --- Base de données H2 en mémoire (aucune installation requise) ---
spring.datasource.url=jdbc:h2:mem:pizzeria_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
# "create-drop" : recrée la base à chaque test, la supprime à la fin
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Console H2 (utile pour déboguer les tests) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Logs minimalistes pendant les tests ---
logging.level.root=WARN
logging.level.com.resto.pizzeria_api=INFO
logging.level.org.hibernate.SQL=WARN

# --- DevTools désactivé en test ---
spring.devtools.restart.enabled=false