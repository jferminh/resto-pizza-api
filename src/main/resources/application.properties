# ============================================================
# application.properties : Configuration commune (tous profils)
# ============================================================

spring.application.name=resto-pizza-api
server.port=8080

# Profil actif par default (a charger en "prod" sur le serveur)
spring.profiles.active=dev

# Erreurs HTTP : ne jamais exposer les d\uFFFDtails en prod
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# JPA commun
spring.jpa.open-in-view=false