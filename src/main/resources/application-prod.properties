# ============================================================
# application-prod.properties : Profil production
# ? Securise : toutes les valeurs sensibles via variables d'env
# ============================================================

# --- Base de donnees (injectee par le serveur / Docker / CI-CD) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Pool de connexions HikariCP (optimise pour la prod) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# --- JPA / Hibernate ---
# "validate" : verifie que le sch\uFFFDma correspond aux entites, sans modifier la BDD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Logs minimalistes en prod ---
logging.level.root=WARN
logging.level.com.resto.pizzeria_api=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --- DevTools desactive en prod ---
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false