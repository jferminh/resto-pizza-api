# .github/workflows/ci-cd.yml
# Pipeline CI/CD — API Spring Boot resto-pizza-api
# Déclenché sur chaque push vers main et sur les Pull Requests

name: CI/CD — resto-pizza-api

# ─── Déclencheurs ────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ─── Variables globales ──────────────────────────────────────────────────────
env:
  JAVA_VERSION: '25'           # ← adapte si tu uses Java 17 ou 21
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resto-pizza-api

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — BUILD & TEST
  # Objectif : compiler, tester, analyser la qualité, produire le .jar
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:

      # 1. Récupérer le code source
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # requis par SonarCloud pour l'analyse git blame

      # 2. Installer Java
      - name: ☕ Installer Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # 3. Cache Maven (accélère les builds suivants)
      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # 4. Compiler + lancer les tests
      - name: 🧪 Compiler et tester
        run: mvn clean verify

      # 5. Publier le rapport de tests (même si les tests échouent)
      - name: 📊 Upload rapport Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # 6. Analyse SonarCloud
      - name: 🔍 Analyse SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

      # 7. Uploader le .jar produit comme artefact GitHub
      - name: 📦 Upload artefact JAR
        uses: actions/upload-artifact@v4
        with:
          name: resto-pizza-api-jar
          path: target/resto-pizza-api-*.jar
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — DOCKER BUILD & PUSH
  # Objectif : construire l'image Docker et la pousser sur Docker Hub
  # Ne tourne QUE sur push vers main (pas sur les PR)
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test      # ← attend que le Job 1 soit vert
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ☕ Installer Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Reconstruire le .jar pour le Docker build
      - name: 🔨 Build du JAR (sans tests — déjà validés)
        run: mvn clean package -DskipTests

      # Se connecter à Docker Hub avec les secrets
      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire et pousser l'image avec 2 tags :
      # - latest : toujours la dernière version de main
      # - sha-xxxxx : tag immuable lié au commit exact (traçabilité)
      - name: 🐳 Build & Push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
