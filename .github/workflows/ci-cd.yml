# .github/workflows/ci-cd.yml
name: CI/CD — resto-pizza-api

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '25'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resto-pizza-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — BUILD, TEST, ALLURE, SONARCLOUD
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:

      # 1. Récupérer le code source
      - name: 📥 Checkout du code
        uses: actions/checkout@v4        # ✅ v4
        with:
          fetch-depth: 0

      # 2. Installer Java
      - name: ☕ Installer Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4      # ✅ v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # 3. Cache Maven
      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # 4. Compiler + tester → génère target/allure-results/ automatiquement
      - name: 🧪 Build & Tests
        run: mvn -B --no-transfer-progress clean verify

      # 5. Générer le rapport Allure HTML (même si les tests échouent)
      - name: 📊 Générer le rapport Allure HTML
        if: always()
        uses: simple-elf/allure-report-action@v2   # ✅ version épinglée
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report
          allure_history: allure-history

      # 6. Upload du rapport HTML comme artefact téléchargeable
      - name: 📤 Upload rapport Allure
        if: always()
        uses: actions/upload-artifact@v4  # ✅ v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 30

      # 7. Publier le rapport sur GitHub Pages
      - name: 🌐 Déployer rapport sur GitHub Pages
        if: always() && github.ref == 'refs/heads/main'  # ✅ logique corrigée
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report

      # 8. Analyse SonarCloud
      - name: 🔍 Analyse SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.source=25

      # 9. Upload du JAR comme artefact réutilisable par le Job Docker
      - name: 📦 Upload artefact JAR
        uses: actions/upload-artifact@v4  # ✅ v4
        with:
          name: resto-pizza-api-jar
          path: target/resto-pizza-api-*.jar
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — DOCKER BUILD & PUSH
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ✅ Réutilise le JAR produit en Job 1 — pas de rebuild
      - name: 📥 Télécharger le JAR depuis Job 1
        uses: actions/download-artifact@v4
        with:
          name: resto-pizza-api-jar
          path: target/

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags : latest (toujours à jour) + sha (traçabilité immuable)
      - name: 🐳 Build & Push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — NOTIFICATION TEAMS
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 📣 Notification
    runs-on: ubuntu-latest
    needs: [ build-and-test, docker ]
    if: always()

    env:
      TEAMS_HOOK_URL: ${{ secrets.TEAMS_WEBHOOK }}

    steps:

      - name: 🎨 Préparer le statut du pipeline
        id: status
        run: |
          BUILD="${{ needs.build-and-test.result }}"
          DOCKER="${{ needs.docker.result }}"

          if [[ "$DOCKER" == "skipped" ]]; then
            DOCKER="success"
          fi

          if [[ "$BUILD" == "success" && "$DOCKER" == "success" ]]; then
            echo "color=3066993"  >> $GITHUB_OUTPUT   # vert
            echo "emoji=✅"       >> $GITHUB_OUTPUT
            echo "status=SUCCÈS"  >> $GITHUB_OUTPUT
          elif [[ "$BUILD" == "failure" || "$DOCKER" == "failure" ]]; then
            echo "color=15158332" >> $GITHUB_OUTPUT   # rouge
            echo "emoji=❌"       >> $GITHUB_OUTPUT
            echo "status=ÉCHEC"   >> $GITHUB_OUTPUT
          else
            echo "color=16776960" >> $GITHUB_OUTPUT   # jaune
            echo "emoji=⚠️"       >> $GITHUB_OUTPUT
            echo "status=ANNULÉ"  >> $GITHUB_OUTPUT
          fi

      - name: 📣 Notification Teams
        if: env.TEAMS_HOOK_URL != ''
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ env.TEAMS_HOOK_URL }}
          notification-summary: >-
            ${{ steps.status.outputs.emoji }} Pipeline ${{ steps.status.outputs.status }}
            — resto-pizza-api
            | Branche : ${{ github.ref_name }}
            | Par : ${{ github.actor }}
            | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          notification-color: ${{ steps.status.outputs.color }}
          timezone: Europe/Paris